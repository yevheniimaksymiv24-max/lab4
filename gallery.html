<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Галерея</title>
    <link rel="stylesheet" href="gallery.css">
</head>
<body>

    <h1 id="top">Галерея Максиміва Євгенія Івановича</h1>
    <p class="back-link"><a href="index.html">Назад на головну</a></p>

    <h2 id="my-images">Мої зображення</h2>

    <div class="gallery-grid">
      <div class="gallery-item item-local">
        <h3 id="in-this-folder">Зображення у цій папці</h3>
        <img src="31343C.svg" alt="Зображення з цієї папки">
      </div>

      <div class="gallery-item item-folder">
        <h3 id="in-folder">Зображення у папці</h3>
        <img src="images/ggg.svg" alt="Зображення з папки images">
      </div>

      <div class="gallery-item item-online">
        <h3 id="online-images">Зображення онлайн</h3>
        <img src="https://placehold.co/1280x1024" alt="Онлайн зображення">
      </div>
    </div>

</body>
</html>
